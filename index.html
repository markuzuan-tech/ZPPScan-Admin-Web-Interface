<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC Admin & Organizer Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: { DEFAULT: '#800020', dark: '#600018', light: '#990026' },
                        charcoal: '#111827'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-charcoal font-sans antialiased min-h-screen flex flex-col">

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="flex-1 flex items-center justify-center p-4 bg-slate-100"></div>

    <!-- MAIN DASHBOARD CONTAINER (Hidden by default) -->
    <div id="dashboard-container" class="flex-1 flex flex-col hidden h-screen overflow-hidden">
        <!-- Responsive Header -->
        <header class="bg-maroon text-white px-4 md:px-6 py-3 shadow-md flex justify-between items-center z-20">
            <div class="flex items-center space-x-3">
                <button id="btn-mobile-sidebar" class="md:hidden text-white p-1 hover:bg-white/10 rounded-lg">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="inline-flex items-center bg-white justify-center text-maroon px-3 py-1.5 rounded-xl font-extrabold text-xs shadow-md border border-slate-100 overflow-hidden">
                    ZPPScan                
                </div>                
                <div>
                    <h1 class="text-xs md:text-sm font-bold tracking-tight">Admin & Organizer Portal</h1>
                    <p class="text-[10px] text-white/80 hidden sm:block">Attendance and Event Registration System</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-[10px] md:text-xs bg-white/20 px-2.5 py-1 rounded-full font-semibold">Administrator</span>
                <button id="btn-logout" class="bg-white text-maroon px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-slate-100 transition shadow flex items-center space-x-1">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <!-- Sidebar Navigation -->
            <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-64 bg-white border-r border-slate-200 flex flex-col p-4 space-y-2 z-10 transform -translate-x-full md:translate-x-0 transition-transform duration-200 shadow-lg md:shadow-none">
                <div class="flex justify-between items-center md:hidden mb-2 px-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Navigation</span>
                    <button id="btn-close-sidebar" class="text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-1 hidden md:block">Menu</p>
                
                <button data-target="dashboard" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-bold bg-maroon text-white transition shadow-sm">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard Overview</span>
                </button>

                <button data-target="events" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">
                    <i data-lucide="calendar-plus" class="w-4 h-4"></i>
                    <span>Event Management</span>
                </button>

                <button data-target="attendance" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                    <span>Attendance & Reports</span>
                </button>

                <button data-target="users" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>User Access Control</span>
                </button>

                <button data-target="security" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span>Security & Privacy</span>
                </button>
            </aside>

            <!-- Dynamic View Target -->
            <main id="view-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-50"></main>
        </div>
    </div>

    <!-- Backend Function Scripts -->
    <script src="js/auth_backend.js"></script>
    <script src="js/router_backend.js"></script>
    <script src="js/event_backend.js"></script>
    <script src="js/attendance_backend.js"></script>
    <script src="js/user_backend.js"></script>
</body>
</html>
