<div class="relative min-h-screen w-full flex items-center justify-center bg-cover bg-center px-4" style="background-image: url('/images/zppsu-campus.png');">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-xs"></div>
    <div class="relative z-10 bg-white/75 backdrop-blur-md w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-200/50 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 mx-auto flex items-center justify-center overflow-hidden shadow-md rounded-2xl bg-white border border-slate-100">
                <img src="/images/app_logo.png" alt="CSC Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="text-xl font-extrabold text-charcoal">Admin Portal</h1>
            <p class="text-xs text-slate-500">Sign in to manage events, attendance, and system controls.</p>
        </div>

        <form id="form-login" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-600 mb-1">Email Address</label>
                <input type="email" id="input-email" required value="admin@zppsu.edu.com" class="w-full border border-slate-200 p-3 rounded-xl outline-none focus:border-maroon bg-slate-50">
            </div>
            <div>
                <label class="block font-bold text-slate-600 mb-1">Password</label>
                <input type="password" id="input-password" required value="••••••••" class="w-full border border-slate-200 p-3 rounded-xl outline-none focus:border-maroon bg-slate-50">
            </div>
            <button type="submit" class="w-full bg-maroon text-white py-3 rounded-xl font-bold text-sm hover:bg-maroon-dark transition shadow-md">
                Sign In
            </button>
        </form>

        <div class="text-center text-[11px] text-slate-400">
            CSC Admin Web Management System - 2026
        </div>
    </div>

</div>
